<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>応用情報技術者試験 Webテキスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 方針: 試験問題冊子のような冷たい白地に藍のインク。左に章目次、右に読みやすい幅の本文。演習は1問1カードで集中させる。 */
:root {
  --paper: #f4f6f9;
  --surface: #ffffff;
  --ink: #17202c;
  --muted: #586374;
  --line: #d6dce5;
  --accent: #23469e;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebf9;
  --ok: #1b7a4c;
  --ok-soft: #e2f3ea;
  --ng: #bf3d29;
  --ng-soft: #fbe9e5;
  --warn: #9a6400;
  --warn-soft: #fbf0d9;
  --code-bg: #eef1f6;
  --shadow: 0 1px 2px rgba(23, 32, 44, .06), 0 4px 14px rgba(23, 32, 44, .05);
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-mono: "BIZ UDGothic", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 288px;
  --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141b; --surface: #171d26; --ink: #e3e8ef; --muted: #98a3b3; --line: #2a3341;
    --accent: #8ea8ff; --accent-ink: #0f1522; --accent-soft: #1d2846;
    --ok: #52c48c; --ok-soft: #14301f; --ng: #ff8068; --ng-soft: #3a1c17; --warn: #e3b04f; --warn-soft: #33270f;
    --code-bg: #1e2531; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141b; --surface: #171d26; --ink: #e3e8ef; --muted: #98a3b3; --line: #2a3341;
  --accent: #8ea8ff; --accent-ink: #0f1522; --accent-soft: #1d2846;
  --ok: #52c48c; --ok-soft: #14301f; --ng: #ff8068; --ng-soft: #3a1c17; --warn: #e3b04f; --warn-soft: #33270f;
  --code-bg: #1e2531; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16.5px; line-height: 1.85;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* 上部バー */
.top {
  position: sticky; top: 0; z-index: 30; height: var(--top-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 19px; letter-spacing: .02em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.top nav { margin-left: auto; display: flex; gap: 4px; }
.top nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-size: 14px; white-space: nowrap; }
.top nav a:hover { background: var(--accent-soft); color: var(--accent); }
.top nav a.on { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; }

/* 骨組み */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.side {
  position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface); padding: 18px 12px 40px;
}
.side h4 { margin: 18px 10px 6px; font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
.side h4:first-child { margin-top: 0; }
.side a {
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: baseline; gap: 4px;
  padding: 5px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.5;
}
.side a .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.side a .pct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side a:hover { background: var(--accent-soft); }
.side a.on { background: var(--accent); color: var(--accent-ink); }
.side a.on .n, .side a.on .pct { color: var(--accent-ink); opacity: .85; }
main { min-width: 0; padding: 32px 24px 96px; }
.wrap { max-width: 46em; margin: 0 auto; }
.wrap.wide { max-width: 64em; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: var(--top-h); width: min(86vw, 320px); z-index: 25; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .side { transform: none; }
  .menu-btn { display: inline-block; }
  .top nav { display: none; }
  .brand small { display: none; }
  main { padding: 22px 16px 80px; }
}

/* 見出しと本文 */
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.4; margin: 0 0 12px; text-wrap: balance; word-break: auto-phrase; letter-spacing: .01em; }
h1 .chno { display: block; font-family: var(--font-body); font-size: 13px; color: var(--accent); letter-spacing: .1em; font-weight: 700; margin-bottom: 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.prose h2 {
  font-family: var(--font-display); font-size: 22px; line-height: 1.5; margin: 44px 0 14px; padding: 2px 0 2px 14px;
  border-left: 4px solid var(--accent); text-wrap: balance; word-break: auto-phrase; scroll-margin-top: calc(var(--top-h) + 12px);
}
.prose h3 { font-size: 17.5px; margin: 28px 0 8px; text-wrap: balance; }
.prose h4 { font-size: 16px; margin: 20px 0 6px; color: var(--accent); }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { padding-left: 1.4em; margin: 0 0 14px; }
.prose li { margin: 2px 0; }
.prose strong { background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.prose code, .q-body code, .choice code, .exp code { font-family: var(--font-mono); font-size: .92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.prose pre, .q-body pre, .exp pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.6; }
.prose pre code, .q-body pre code, .exp pre code { background: none; padding: 0; font-size: 14px; }
.tw { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tw table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.tw th, .tw td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tw th { background: var(--accent-soft); font-weight: 700; white-space: nowrap; }
.tw tr:last-child td { border-bottom: 0; }
.tw td { font-variant-numeric: tabular-nums; }

.box { border-radius: 10px; padding: 14px 16px 4px; margin: 18px 0; border: 1px solid var(--line); background: var(--surface); }
.box::before { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-bottom: 4px; }
.box.point { background: var(--accent-soft); border-color: transparent; }
.box.point::before { content: "ポイント"; color: var(--accent); }
.box.formula { border: 1.5px solid var(--accent); }
.box.formula::before { content: "公式"; color: var(--accent); }
.box.caution { border-left: 4px solid var(--ng); }
.box.caution::before { content: "ひっかけ注意"; color: var(--ng); }
.box.example::before { content: "例題"; color: var(--warn); }
.box.example { border-left: 4px solid var(--warn); }
.box.trend::before { content: "最新動向"; color: var(--ok); }
.box.trend { border-left: 4px solid var(--ok); }
.box p:last-child, .box ul:last-child, .box ol:last-child { margin-bottom: 10px; }

.goals { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 0 0 18px; }
.goals h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.goals ul { margin: 0; padding-left: 1.2em; }
.goals .syl { margin-top: 8px; font-size: 13px; color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.toc button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.toc button:hover { color: var(--accent); border-color: var(--accent); }

/* ボタン類 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 8px 16px; cursor: pointer; text-decoration: none; font-size: 15px; line-height: 1.4;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; line-height: 1.7; white-space: nowrap; }
.lv1 { background: var(--ok-soft); color: var(--ok); }
.lv2 { background: var(--accent-soft); color: var(--accent); }
.lv3 { background: var(--ng-soft); color: var(--ng); }
.chip.muted { background: var(--code-bg); color: var(--muted); }

/* カード */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

/* ホーム */
.hero { padding: 8px 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.hero h1 { font-size: 34px; }
@media (max-width: 560px) { .hero h1 { font-size: 27px; } h1 { font-size: 25px; } }
.hero .kicker { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .1em; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin: 18px 0; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts dt { font-size: 12px; color: var(--muted); margin: 0; }
.facts dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.5; }
.section-title { font-family: var(--font-display); font-size: 21px; margin: 34px 0 12px; }
.steps { counter-reset: st; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.step b { display: block; margin-bottom: 2px; }
.step p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.7; }
.chlist { display: grid; gap: 8px; }
.chrow {
  display: grid; grid-template-columns: 3.2em 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-decoration: none; color: var(--ink);
}
.chrow:hover { border-color: var(--accent); }
.chrow .no { font-family: var(--font-display); color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; }
.chrow .t { font-weight: 700; line-height: 1.5; }
.chrow .s { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.meter { width: 120px; }
.meter .bar { height: 6px; background: var(--code-bg); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter small { display: block; font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; margin-top: 2px; }
@media (max-width: 560px) { .chrow { grid-template-columns: 2.4em 1fr; } .chrow .meter { grid-column: 2; width: 100%; } }

/* 演習の入口（章末） */
.drill { margin-top: 48px; border-top: 2px solid var(--ink); padding-top: 18px; }
.drill h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; }
.drill .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.drill .opt { text-align: left; display: block; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.drill .opt:hover { border-color: var(--accent); }
.drill .opt b { display: block; font-size: 16px; }
.drill .opt span { font-size: 13px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; }
.pager a { flex: 1; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); color: var(--ink); font-size: 14px; }
.pager a small { display: block; color: var(--muted); font-size: 12px; }
.pager a.next { text-align: right; }
.pager a:hover { border-color: var(--accent); }

/* 演習 */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px 18px; box-shadow: var(--shadow); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.qmeta .num { font-family: var(--font-display); color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
.prog { height: 4px; background: var(--code-bg); border-radius: 99px; overflow: hidden; margin: 0 0 16px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.q-body p { margin: 0 0 12px; }
.q-body .tw { margin-top: 4px; }
.choices { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.choice {
  width: 100%; display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; align-items: start; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; line-height: 1.65;
}
.choice:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.choice .k { font-weight: 700; color: var(--accent); font-family: var(--font-display); font-size: 17px; line-height: 1.5; }
.choice .mark { font-weight: 700; font-size: 13px; white-space: nowrap; }
.choice.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-correct .mark { color: var(--ok); }
.choice.is-wrong { border-color: var(--ng); background: var(--ng-soft); }
.choice.is-wrong .mark { color: var(--ng); }
.choice.is-picked { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice[disabled] { cursor: default; }
.verdict { margin: 16px 0 6px; font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.exp { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 8px; }
.exp p { margin: 0 0 10px; }
.qnav { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
.kbd-hint { font-size: 12px; color: var(--muted); }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 14px; margin: 0 0 14px; background: var(--surface); }
legend { font-weight: 700; padding: 0 6px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 14px; }
.checks label, .radios label { display: flex; gap: 8px; align-items: baseline; font-size: 14.5px; cursor: pointer; line-height: 1.6; padding: 3px 0; }
.radios { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.areahead { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; font-weight: 700; font-size: 14px; }
.areahead:first-child { margin-top: 0; }
.areahead button { font-size: 12px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.count-note { color: var(--muted); font-size: 14px; }

.result-top { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; margin-bottom: 16px; }
.score { font-family: var(--font-display); font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 18px; color: var(--muted); font-family: var(--font-body); }
.pass { font-weight: 700; padding: 4px 14px; border-radius: 999px; }
.pass.ok { background: var(--ok-soft); color: var(--ok); }
.pass.ng { background: var(--ng-soft); color: var(--ng); }
.breakdown { display: grid; gap: 6px; margin: 10px 0 18px; }
.bd { display: grid; grid-template-columns: 9em 1fr 5.5em; gap: 10px; align-items: center; font-size: 14px; }
.bd .bar { height: 8px; background: var(--code-bg); border-radius: 99px; overflow: hidden; }
.bd .bar i { display: block; height: 100%; background: var(--accent); }
.bd .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
details.rev { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 8px 0; }
details.rev > summary { cursor: pointer; padding: 10px 14px; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev > summary .sum-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
details.rev .rev-in { padding: 0 16px 12px; border-top: 1px solid var(--line); }
.ans-line { font-size: 14px; margin: 10px 0; }
.ans-line b.ok { color: var(--ok); }
.ans-line b.ng { color: var(--ng); }

/* 模擬試験 */
.exam-bar {
  position: sticky; top: var(--top-h); z-index: 10; background: var(--paper); padding: 10px 0; margin-bottom: 10px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--line);
}
.timer { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--ng); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin: 12px 0; }
.qgrid button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 0; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; position: relative; }
.qgrid button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.qgrid button.cur { box-shadow: inset 0 0 0 2px var(--ink); }
.qgrid button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.qgrid button.r-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.qgrid button.r-ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.tools label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.tools textarea, .tools input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-family: var(--font-mono); font-size: 14px; }
.tools output { display: block; margin-top: 8px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; min-height: 1.6em; }
.fig { margin: 18px 0; padding: 14px 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow-x: auto; text-align: center; }
.fig svg { max-width: 100%; height: auto; font-family: var(--font-body); }
.fig figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border-radius: 14px; padding: 20px 22px; max-width: 420px; width: 100%; box-shadow: var(--shadow); }
.dialog h3 { margin: 0 0 8px; }

/* 科目B */
.kb-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.kb-body { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px 6px; margin-bottom: 22px; }
.kb-q { border-top: 2px solid var(--ink); padding-top: 14px; margin-top: 26px; }
.kb-q h3 { font-family: var(--font-display); margin: 0 0 8px; font-size: 19px; }
.kb-q textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); line-height: 1.7; resize: vertical; }
.kb-q label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
.kb-ans { background: var(--ok-soft); border-radius: 10px; padding: 12px 16px 2px; margin-top: 10px; }
.kb-ans::before { content: "解答例と採点のポイント"; display: block; font-size: 12px; font-weight: 700; color: var(--ok); letter-spacing: .06em; margin-bottom: 4px; }
.kbcard { display: block; text-decoration: none; color: var(--ink); }
.kbcard:hover { border-color: var(--accent); }
.kbcard .slot { font-size: 12.5px; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.kbcard h3 { margin: 2px 0 6px; font-size: 17px; line-height: 1.5; }
.kbcard p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.7; }

/* 進捗 */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0 0 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.tile small { color: var(--muted); font-size: 12.5px; }
.tile b { display: block; font-size: 26px; font-family: var(--font-display); font-variant-numeric: tabular-nums; line-height: 1.3; }
.ptable .tw td:nth-child(n+2) { text-align: right; }
.mini { display: inline-block; width: 70px; height: 6px; background: var(--code-bg); border-radius: 99px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.mini i { display: block; height: 100%; background: var(--accent); }
.mini.lowv i { background: var(--ng); }
.note { font-size: 13px; color: var(--muted); }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="目次を開く" aria-expanded="false">目次</button>
  <a class="brand" href="#home"><b>応用情報 Webテキスト</b><small>2026年度 CBT対応</small></a>
  <nav aria-label="主要メニュー">
    <a href="#home" data-nav="home">ホーム</a>
    <a href="#ch-01" data-nav="ch">テキスト</a>
    <a href="#practice" data-nav="practice">問題演習</a>
    <a href="#exam" data-nav="exam">模擬科目A</a>
    <a href="#kamoku-b" data-nav="kb">科目B演習</a>
    <a href="#progress" data-nav="progress">学習の記録</a>
  </nav>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="目次"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<script>const DATA = /*__DATA__*/null;</script>
<script>
(function () {
  "use strict";
  var CH = DATA.chapters, QS = DATA.questions, KB = DATA.kamokub, PG = DATA.pages;
  var KANA = ["ア", "イ", "ウ", "エ"];
  var LVNAME = { 1: "基本", 2: "標準", 3: "上級" };
  var LVDESC = { 1: "用語と定義を固める", 2: "科目A本番レベル", 3: "計算・複合・科目Bへの橋渡し" };
  var AREAS = ["テクノロジ系", "マネジメント系", "ストラテジ系"];
  /* 本番の科目Aの分野比率に合わせた章ごとの出題数（合計80） */
  var EXAM_ALLOC = { "01": 4, "02": 3, "03": 4, "04": 4, "05": 4, "06": 3, "07": 2, "08": 5, "09": 5, "10": 10, "11": 6, "12": 4, "13": 3, "14": 3, "15": 5, "16": 5, "17": 3, "18": 4, "19": 3 };
  var chById = {}, qById = {}, kbById = {};
  CH.forEach(function (c) { chById[c.id] = c; });
  QS.forEach(function (q) { qById[q.id] = q; });
  KB.forEach(function (k) { kbById[k.id] = k; });
  var qByCh = {};
  QS.forEach(function (q) { (qByCh[q.ch] = qByCh[q.ch] || []).push(q); });

  var main = document.getElementById("main");
  var side = document.getElementById("side");

  /* ---------- 保存（この端末のブラウザのみ） ---------- */
  var KEY = "apweb-v1";
  var mem = { h: {}, b: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.h) mem = { h: p.h || {}, b: p.b || {} }; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  /* 記録の形式: [解答回数, 正解回数, 直近が正解か, 初めて解いたときに正解したか, 正解した日の一覧]
     ・正答率 … 初めて解いたときの正答率。解説を読んだ直後の解き直しでは上がらない
     ・定着   … 直近の解答が正解で、かつ別々の2日以上で正解していること
     ・要復習 … 一度でも間違え、まだ定着していない問題
     旧形式（3要素）の記録は、全問正解のときだけ初見正解とみなし、正解した日は空として扱う */
  function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function norm(r) { if (r.length < 5) { r[3] = (r[0] > 0 && r[0] === r[1]) ? 1 : 0; r[4] = []; } return r; }
  function record(id, ok) {
    var r = mem.h[id];
    if (!r) r = [0, 0, 0, ok ? 1 : 0, []]; else norm(r);
    r[0] += 1; r[2] = ok ? 1 : 0;
    if (ok) { r[1] += 1; var d = today(); if (r[4].indexOf(d) < 0) { r[4].push(d); if (r[4].length > 3) r[4] = r[4].slice(-3); } }
    mem.h[id] = r; save();
  }
  function status(id) {
    var r = mem.h[id]; if (!r) return "todo"; norm(r);
    if (r[2] && r[4].length >= 2) return "mastered";
    return r[1] < r[0] ? "review" : "pending";
  }
  function stat(list) {
    var done = 0, first = 0, tries = 0, mastered = 0, review = 0, pending = 0;
    list.forEach(function (q) { var r = mem.h[q.id]; if (r) { norm(r); done++; if (r[3]) first++; tries += r[0]; var s = status(q.id); if (s === "mastered") mastered++; else if (s === "review") review++; else pending++; } });
    return { total: list.length, done: done, first: first, tries: tries, mastered: mastered, review: review, pending: pending };
  }
  function orderFor(q, hadRecord) {
    var o = q.c.map(function (_, i) { return i; });
    if (!hadRecord) return o;
    var s; do { s = shuffle(o); } while (s.every(function (v, i) { return v === i; }));
    return s;
  }

  /* ---------- 共通 ---------- */
  function h(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plain(html) { var d = document.createElement("div"); d.innerHTML = html; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
  function chLabel(c) { return "第" + c.no + "章"; }
  function lvChip(lv) { return '<span class="chip lv' + lv + '">' + LVNAME[lv] + "</span>"; }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function setView(html, wide) { main.innerHTML = '<div class="wrap' + (wide ? " wide" : "") + '">' + html + footHtml() + "</div>"; }
  function footHtml() {
    return '<div class="foot">本テキストはIPA（独立行政法人情報処理推進機構）が公開している試験要綱 Ver.5.6 と応用情報技術者試験シラバス Ver.7.2 の出題範囲に沿って作成した独自教材です。問題はすべて本テキストのオリジナルで、IPAの過去問題の転載ではありません。本番形式の確認にはIPAの過去問題（<a href="https://www.ipa.go.jp/shiken/mondai-kaiotu/index.html">ipa.go.jp</a>）も併用してください。学習の記録はこのブラウザ内にだけ保存されます。</div>';
  }
  function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; }

  /* ---------- サイドバー ---------- */
  function buildSide() {
    var s = '<h4>はじめに</h4>' +
      '<a href="#info" data-r="info"><span class="n"></span><span>試験の概要（CBT）</span></a>' +
      '<a href="#howto" data-r="howto"><span class="n"></span><span>学習の進め方</span></a>';
    AREAS.forEach(function (ar) {
      s += "<h4>" + ar + "</h4>";
      CH.filter(function (c) { return c.area === ar; }).forEach(function (c) {
        var st = stat(qByCh[c.id] || []);
        s += '<a href="#ch-' + c.id + '" data-r="ch-' + c.id + '"><span class="n">' + c.no + "</span><span>" + h(c.title) + '</span><span class="pct">' + (st.done ? pct(st.mastered, st.total) + "%" : "") + "</span></a>";
      });
    });
    s += "<h4>科目B対策</h4>" + '<a href="#b-method" data-r="b-method"><span class="n"></span><span>記述式の解き方</span></a>';
    KB.forEach(function (k, i) { s += '<a href="#b-' + k.id + '" data-r="b-' + k.id + '"><span class="n">B' + (i + 1) + "</span><span>" + h(k.title) + "</span></a>"; });
    s += "<h4>演習と記録</h4>" +
      '<a href="#practice" data-r="practice"><span class="n"></span><span>問題演習</span></a>' +
      '<a href="#exam" data-r="exam"><span class="n"></span><span>模擬科目A（80問）</span></a>' +
      '<a href="#progress" data-r="progress"><span class="n"></span><span>学習の記録</span></a>';
    side.innerHTML = s;
  }
  function markSide(r) {
    side.querySelectorAll("a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-r") === r); });
    var key = r.indexOf("ch-") === 0 ? "ch" : (r.indexOf("b-") === 0 || r === "kamoku-b") ? "kb" : r;
    document.querySelectorAll(".top nav a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === key); });
  }

  /* ---------- ルーティング ---------- */
  var timerId = null;
  function route() {
    if (timerId && !(exam && !exam.done && (location.hash.slice(1) === "exam"))) { clearInterval(timerId); timerId = null; }
    var r = location.hash.slice(1) || "home";
    document.body.classList.remove("nav-open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
    buildSide();
    markSide(r);
    if (r === "home") viewHome();
    else if (r === "info" || r === "howto" || r === "b-method") viewPage(r);
    else if (r.indexOf("ch-") === 0 && chById[r.slice(3)]) viewChapter(r.slice(3));
    else if (r === "practice") { if (session && session.done) session = null; viewPractice(); }
    else if (r === "exam") viewExam();
    else if (r === "kamoku-b") viewKBList();
    else if (r.indexOf("b-") === 0 && kbById[r.slice(2)]) viewKB(r.slice(2));
    else if (r === "progress") viewProgress();
    else viewHome();
    if (!(r === "exam" && exam && !exam.done) && !(r === "practice" && session && session.keepScroll)) window.scrollTo(0, 0);
    if (session) session.keepScroll = false;
  }

  /* ---------- ホーム ---------- */
  function chRows(area) {
    return CH.filter(function (c) { return c.area === area; }).map(function (c) {
      var st = stat(qByCh[c.id] || []);
      return '<a class="chrow" href="#ch-' + c.id + '"><span class="no">' + String(c.no).padStart(2, "0") + '</span><span><span class="t">' + h(c.title) + '</span><span class="s">' + h(c.syllabus) + '</span></span><span class="meter"><span class="bar"><i style="width:' + pct(st.done, st.total) + '%"></i></span><small>' + st.done + " / " + st.total + "問</small></span></a>";
    }).join("");
  }
  function viewHome() {
    var all = stat(QS);
    var cnt = { 1: 0, 2: 0, 3: 0 }; QS.forEach(function (q) { cnt[q.lv]++; });
    var s = '<section class="hero"><div class="kicker">IPA 試験要綱 Ver.5.6・シラバス Ver.7.2 準拠</div>' +
      "<h1>応用情報技術者試験 Webテキスト</h1>" +
      '<p class="lead">全' + CH.length + "章の解説と、基本・標準・上級の3段階で並べた" + QS.length + "問の四肢択一問題、科目B（記述式）の演習" + KB.length + "題を収録しています。解説を読んだら章末の演習で確認し、最後に80問150分の模擬科目Aで仕上げます。</p>" +
      '<div class="row"><a class="btn primary" href="#ch-01">第1章から読む</a><a class="btn" href="#practice">問題演習を始める</a><a class="btn" href="#exam">模擬科目Aに挑戦</a></div></section>';
    s += '<dl class="facts">' +
      "<div><dt>科目A（旧 午前）</dt><dd>150分・80問<br>四肢択一・全問必須</dd></div>" +
      "<div><dt>科目B（旧 午後）</dt><dd>150分・11問中5問<br>記述式</dd></div>" +
      "<div><dt>合格基準</dt><dd>科目A・科目Bとも<br>100点満点中60点以上</dd></div>" +
      "<div><dt>令和8年度 前期の科目B</dt><dd>2026年11月24日〜<br>12月6日</dd></div>" +
      "</dl>";
    s += '<p class="note">2026年度から全試験区分がCBT方式です。詳しくは<a href="#info">試験の概要</a>へ。</p>';
    s += '<h2 class="section-title">3段階で積み上げる</h2><div class="steps">' +
      '<div class="step"><b>' + lvChip(1) + " 基本 " + cnt[1] + "問</b><p>用語の意味と基本の計算。基本情報技術者レベルの土台を確認します。</p></div>" +
      '<div class="step"><b>' + lvChip(2) + " 標準 " + cnt[2] + "問</b><p>科目A本番の標準的な問題。比較・計算・用語の使い分けを問います。</p></div>" +
      '<div class="step"><b>' + lvChip(3) + " 上級 " + cnt[3] + "問</b><p>複数知識の組合せや本番の難問レベル。科目Bの記述につながる思考を鍛えます。</p></div>" +
      '<div class="step"><b><span class="chip muted">仕上げ</span> 模擬試験と科目B</b><p>80問150分の模擬科目Aと、問1必須の情報セキュリティを含む記述式演習で総仕上げ。</p></div>' +
      "</div>";
    AREAS.forEach(function (ar) { s += '<h2 class="section-title">' + ar + '</h2><div class="chlist">' + chRows(ar) + "</div>"; });
    s += '<h2 class="section-title">科目B 記述式演習</h2><div class="grid c2">' + kbCards() + "</div>";
    if (all.done) s += '<p class="note" style="margin-top:18px">これまでに ' + all.done + " 問を解き、初めて解いたときの正答率は " + pct(all.first, all.done) + "%、定着した問題は " + all.mastered + " 問です。<a href=\"#progress\">学習の記録を見る</a></p>";
    setView(s, true);
  }

  /* ---------- 固定ページ ---------- */
  function viewPage(id) {
    var p = PG[id === "b-method" ? "bmethod" : id];
    if (!p) return viewHome();
    var toc = p.sections.length > 2 ? '<div class="toc">' + p.sections.map(function (x) { return '<button type="button" data-scroll="' + x.id + '">' + h(x.title) + "</button>"; }).join("") + "</div>" : "";
    var tail = id === "b-method" ? '<h2 class="section-title">演習問題</h2><div class="grid c2">' + kbCards() + "</div>" : id === "howto" ? '<div class="row" style="margin-top:20px"><a class="btn primary" href="#ch-01">第1章へ進む</a><a class="btn" href="#practice">問題演習へ</a></div>' : "";
    setView("<h1>" + h(p.title) + "</h1>" + (p.lead ? '<p class="lead">' + h(p.lead) + "</p>" : "") + toc + '<div class="prose">' + p.html + "</div>" + tail);
  }

  /* ---------- 章 ---------- */
  function viewChapter(id) {
    var c = chById[id], idx = CH.indexOf(c);
    var qs = qByCh[id] || [];
    var by = { 1: [], 2: [], 3: [] }; qs.forEach(function (q) { by[q.lv].push(q); });
    var s = '<div class="crumb">' + h(c.area) + "</div>" +
      '<h1><span class="chno">' + chLabel(c) + "</span>" + h(c.title) + "</h1>";
    if (c.goals.length) s += '<div class="goals"><h3>この章のねらい</h3><ul>' + c.goals.map(function (g) { return "<li>" + h(g) + "</li>"; }).join("") + "</ul>" + (c.syllabus ? '<div class="syl">シラバス対応：' + h(c.syllabus) + "</div>" : "") + "</div>";
    if (c.sections.length) s += '<div class="toc">' + c.sections.map(function (x) { return '<button type="button" data-scroll="' + x.id + '">' + h(x.title) + "</button>"; }).join("") + '<button type="button" data-scroll="drill">章末演習</button></div>';
    s += '<article class="prose">' + c.html + "</article>";
    s += '<section class="drill" id="drill"><h2>章末演習</h2><p class="note">この章の問題は全' + qs.length + "問です。基本から順に進めると、本番レベルまで無理なく上がれます。</p><div class=\"opts\">";
    [1, 2, 3].forEach(function (lv) {
      var st = stat(by[lv]);
      s += '<button type="button" class="opt" data-start="' + id + "|" + lv + '"' + (by[lv].length ? "" : " disabled") + "><b>" + lvChip(lv) + " " + by[lv].length + "問</b><span>" + LVDESC[lv] + (st.done ? "・定着 " + st.mastered + "/" + st.total : "") + "</span></button>";
    });
    s += '<button type="button" class="opt" data-start="' + id + '|all"><b>すべて ' + qs.length + "問</b><span>基本から上級まで通しで解く</span></button></div></section>";
    var prev = CH[idx - 1], next = CH[idx + 1];
    s += '<nav class="pager">' + (prev ? '<a href="#ch-' + prev.id + '"><small>前の章</small>' + chLabel(prev) + " " + h(prev.title) + "</a>" : "<span></span>") +
      (next ? '<a class="next" href="#ch-' + next.id + '"><small>次の章</small>' + chLabel(next) + " " + h(next.title) + "</a>" : '<a class="next" href="#b-method"><small>次へ</small>科目Bの解き方</a>') + "</nav>";
    setView(s);
  }

  /* ---------- 問題演習 ---------- */
  var session = null;
  var setup = { chs: CH.map(function (c) { return c.id; }), lvs: [1, 2, 3], mode: "order", count: "20" };
  function pool(cfg) {
    var list = QS.filter(function (q) { return cfg.chs.indexOf(q.ch) >= 0 && cfg.lvs.indexOf(q.lv) >= 0; });
    if (cfg.mode === "new") list = list.filter(function (q) { return !mem.h[q.id]; });
    if (cfg.mode === "wrong") list = list.filter(function (q) { return status(q.id) === "review"; });
    if (cfg.mode === "unfixed") list = list.filter(function (q) { var s = status(q.id); return s === "review" || s === "pending"; });
    return list;
  }
  function startSession(list, title, back) {
    var ord = {}; list.forEach(function (q) { ord[q.id] = orderFor(q, !!mem.h[q.id]); });
    session = { list: list.map(function (q) { return q.id; }), i: 0, ans: {}, ord: ord, title: title, back: back || "practice", done: false };
    go("practice");
  }
  function startFromCfg(cfg, title) {
    var list = pool(cfg);
    if (cfg.mode === "random") list = shuffle(list);
    else list.sort(function (a, b) { return a.ch === b.ch ? (a.lv - b.lv || (a.id < b.id ? -1 : 1)) : (a.ch < b.ch ? -1 : 1); });
    if (cfg.count !== "all") list = list.slice(0, parseInt(cfg.count, 10));
    if (!list.length) return;
    startSession(list, title);
  }
  function viewPractice() {
    if (session && !session.done) return viewQuestion();
    if (session && session.done) return viewResult();
    viewSetup();
  }
  function viewSetup() {
    var s = "<h1>問題演習</h1><p class=\"lead\">範囲・レベル・出題順を選んで演習します。1問ごとに正誤と解説が表示されます。キーボードの 1〜4 で選択、Enter で次へ進めます。</p>";
    s += '<form id="setupForm"><fieldset><legend>範囲（章）</legend>';
    AREAS.forEach(function (ar) {
      s += '<div class="areahead">' + ar + ' <button type="button" data-area-all="' + ar + '">すべて選択</button><button type="button" data-area-none="' + ar + '">解除</button></div><div class="checks">';

    var all = stat(QS);
    var wrongN = all.review, unfixedN = all.review + all.pending;
    var s = "<h1>学習の記録</h1><p class=\"lead\">記録はこのブラウザの中にだけ保存されます。別の端末やブラウザには引き継がれません。</p>";
    s += '<div class="tiles"><div class="tile"><small>解いた問題</small><b>' + all.done + " / " + all.total + '</b></div><div class="tile"><small>初見の正答率</small><b>' + (all.done ? pct(all.first, all.done) + "%" : "－") + '</b></div><div class="tile"><small>定着した問題</small><b>' + all.mastered + '</b></div><div class="tile"><small>要復習</small><b>' + wrongN + "</b></div></div>";
    s += '<p class="note">正答率は、初めて解いたときの結果だけで数えます。解説を読んだ後の解き直しでは上がりません。定着は、直近の解答が正解で、別々の2日以上で正解した問題です。要復習は、一度でも間違えて、まだ定着していない問題です。解き直すときは、選択肢の順番を入れ替えます。</p>';
    s += '<div class="row" style="margin-bottom:18px"><button class="btn primary" type="button" data-act="drill-wrong"' + (wrongN ? "" : " disabled") + '>要復習の問題を解く</button><button class="btn" type="button" data-act="drill-unfixed"' + (unfixedN ? "" : " disabled") + '>定着していない問題を解き直す</button><button class="btn" type="button" data-act="drill-new"' + (all.done < all.total ? "" : " disabled") + ">まだ解いていない問題を解く</button></div>";
    var rows = CH.map(function (c) {
      var list = qByCh[c.id] || [];
      var st = stat(list);
      var p = pct(st.first, st.done);
      var lv = [1, 2, 3].map(function (l) { var x = stat(list.filter(function (q) { return q.lv === l; })); return x.done ? pct(x.first, x.done) + "%" : "－"; });
      return '<tr><td><a href="#ch-' + c.id + '">' + chLabel(c) + " " + h(c.title) + "</a></td><td>" + st.done + "/" + st.total + '</td><td><span class="mini' + (st.done && p < 60 ? " lowv" : "") + '"><i style="width:' + p + '%"></i></span>' + (st.done ? p + "%" : "－") + "</td><td>" + lv.join(" / ") + "</td><td>" + st.mastered + "</td><td>" + st.review + "</td></tr>";
    }).join("");
    s += '<div class="ptable"><div class="tw"><table><thead><tr><th>章</th><th>解答</th><th>初見の正答率</th><th>基本 / 標準 / 上級</th><th>定着</th><th>要復習</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>";
    s += '<p class="note">初見の正答率が60%未満の章は赤で表示します。章名から解説に戻れます。</p><div class="row" style="margin-top:24px"><button class="btn danger" type="button" data-act="reset">記録をすべて消去</button></div>';
    setView(s, true);
  }

  /* ---------- イベント ---------- */
  document.getElementById("menuBtn").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  main.addEventListener("click", function (e) {
    var t = e.target.closest("button, a");
    if (!t) return;
    var sc = t.getAttribute("data-scroll");
    if (sc) { var el = document.getElementById(sc); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    var st = t.getAttribute("data-start");
    if (st) {
      var p2 = st.split("|"), c = chById[p2[0]];
      var list = (qByCh[c.id] || []).filter(function (q) { return p2[1] === "all" || q.lv === +p2[1]; });
      list.sort(function (a, b) { return a.lv - b.lv || (a.id < b.id ? -1 : 1); });
      startSession(list, chLabel(c) + " " + c.title + "（" + (p2[1] === "all" ? "すべて" : LVNAME[p2[1]]) + "）");
      return;
    }
    if (t.hasAttribute("data-k")) { answer(+t.getAttribute("data-k")); return; }
    if (t.hasAttribute("data-ek")) { exam.ans[exam.list[exam.i]] = +t.getAttribute("data-ek"); viewExamQ(); return; }
    if (t.hasAttribute("data-jump")) { exam.i = +t.getAttribute("data-jump"); viewExamQ(); return; }
    if (t.hasAttribute("data-revjump")) {
      var ds = main.querySelectorAll("details.rev");
      var id = exam.list[+t.getAttribute("data-revjump")];
      var tmp = { list: [id], i: 0, ans: {}, title: "模擬科目A 問" + (+t.getAttribute("data-revjump") + 1) + " の見直し", done: true };
      tmp.ans[id] = exam.ans[id];
      var ov = document.createElement("div"); ov.className = "overlay";
      ov.innerHTML = '<div class="dialog" style="max-width:720px;max-height:86vh;overflow:auto"><div class="row"><h3 style="margin:0">' + h(tmp.title) + '</h3><span class="spacer"></span><button class="btn" type="button" data-x="no">閉じる</button></div>' + reviewHtml([id], tmp.ans, false).replace("<details", "<details open") + "</div>";
      document.body.appendChild(ov);
      ov.addEventListener("click", function (ev) { if (ev.target === ov || ev.target.getAttribute("data-x") === "no") ov.remove(); });
      return;
    }
    var rv = t.getAttribute("data-reveal");
    if (rv) { var box = document.getElementById("ans-" + rv); box.hidden = !box.hidden; t.textContent = box.hidden ? "解答例を表示" : "解答例を隠す"; return; }
    var act = t.getAttribute("data-act");
    if (!act) return;
    if (act === "next") nextQ();
    else if (act === "quit") { session.done = true; viewResult(); window.scrollTo(0, 0); }
    else if (act === "retry-wrong") { var w = session.list.filter(function (id) { return session.ans.hasOwnProperty(id) && session.ans[id] !== qById[id].a; }).map(function (id) { return qById[id]; }); startSession(w, session.title + "：間違えた問題"); }
    else if (act === "retry-all") startSession(session.list.map(function (id) { return qById[id]; }), session.title);
    else if (act === "new-setup") { session = null; viewSetup(); }
    else if (act === "exam-start") { exam = buildExam(); viewExamQ(); window.scrollTo(0, 0); }
    else if (act === "exam-grid") { exam.grid = !exam.grid; viewExamQ(); }
    else if (act === "exam-prev") { if (exam.i) { exam.i--; viewExamQ(); } }
    else if (act === "exam-next") { if (exam.i + 1 < exam.list.length) { exam.i++; viewExamQ(); } }
    else if (act === "exam-finish") {
      var left = exam.list.length - Object.keys(exam.ans).length;
      confirmBox("採点しますか", left ? "未解答が " + left + " 問あります。採点すると解答は変更できません。" : "採点すると解答は変更できません。", "採点する", finishExam);
    }
    else if (act === "exam-new") { exam = null; viewExamIntro(); }
    else if (act === "exam-wrong") { var ew = exam.list.filter(function (id) { return exam.ans[id] !== qById[id].a; }).map(function (id) { return qById[id]; }); startSession(ew, "模擬科目A：間違えた問題"); }
    else if (act === "drill-wrong") { session = null; startFromCfg({ chs: CH.map(function (c) { return c.id; }), lvs: [1, 2, 3], mode: "wrong", count: "all" }, "復習：要復習の問題"); }
    else if (act === "drill-unfixed") { session = null; startFromCfg({ chs: CH.map(function (c) { return c.id; }), lvs: [1, 2, 3], mode: "unfixed", count: "all" }, "復習：定着していない問題"); }
    else if (act === "drill-new") { session = null; startFromCfg({ chs: CH.map(function (c) { return c.id; }), lvs: [1, 2, 3], mode: "new", count: "20" }, "まだ解いていない問題"); }
    else if (act === "reset") confirmBox("記録を消去しますか", "このブラウザに保存した解答記録と科目Bの下書きをすべて消去します。元に戻せません。", "消去する", function () { mem = { h: {}, b: {} }; save(); route(); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector(".overlay")) return;
    var r = location.hash.slice(1);
    var n = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
    if (r === "practice" && session && !session.done) {
      var q = qById[session.list[session.i]];
      if (n !== undefined && !session.ans.hasOwnProperty(q.id)) { e.preventDefault(); answer(session.ord[q.id][n]); }
      else if ((e.key === "Enter" || e.key === "ArrowRight") && session.ans.hasOwnProperty(q.id)) { e.preventDefault(); nextQ(); }
    } else if (r === "exam" && exam && !exam.done) {
      if (n !== undefined) { exam.ans[exam.list[exam.i]] = exam.ord[exam.list[exam.i]][n]; viewExamQ(); }
      else if (e.key === "ArrowRight" && exam.i + 1 < exam.list.length) { exam.i++; viewExamQ(); }
      else if (e.key === "ArrowLeft" && exam.i) { exam.i--; viewExamQ(); }
    }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
